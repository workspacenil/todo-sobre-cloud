<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operador Local</title>
  <meta name="description" content="Interfaz de acceso remoto al Operador Local">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3261/3261304.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Overlay de Login -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-box">
      <h2>Acceso Restringido</h2>
      <p>Introduce la contraseña maestra</p>
      <input type="password" id="authInput" placeholder="Contraseña..." />
      <button id="authBtn">Desbloquear</button>
      <p id="authError" class="auth-error hidden">Credenciales incorrectas</p>
    </div>
  </div>

  <!-- Contenido Principal -->
  <div id="mainContent" class="main-content hidden">

    <main class="dashboard">
      <!-- Chat Central -->
      <section class="chat-section">
        <div class="chat-container">
          <div class="chat-header">
            <div style="display: flex; align-items: center; gap: 10px;">
              <span class="status-dot blink"></span>
              <h3>Agente Gemini 3.1 Pro</h3>
            </div>
            <button id="wakeBtn" class="wake-btn" style="margin-left: auto;">🔌 Encender PC</button>
          </div>
          <div class="chat-messages" id="chatMessages">
            <div class="message bot fade-in delay-fast">
              <p>Hola, he inicializado el sistema remoto. Tienes conexión directa con tu PC. ¿Qué necesitas?</p>
            </div>
          </div>
          <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Pregunta algo o usa un comando..." autocomplete="off">
            <button id="sendBtn" class="send-btn">➤</button>
          </div>
        </div>
      </section>

      <!-- Panel de Comandos -->
      <section class="commands-section">
        <div class="commands-container glass-panel">
          <h3>📋 Comandos Disponibles</h3>
          <ul class="cmd-list" id="cmdList">
            <!-- Cargados dinámicamente desde app.js -->
          </ul>
        </div>
      </section>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
